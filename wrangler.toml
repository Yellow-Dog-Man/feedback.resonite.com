name = "feedback-resonite-com"
main = "./src/backend/main.js"
compatibility_date = "2026-03-11"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
ACCOUNT_ID = ""


[assets]
directory = "./dist"
binding = "ASSETS"

[[analytics_engine_datasets]]
binding = "SCORE"
dataset = "SCORE"

[[d1_databases]]
binding = "DB"
database_name = "feedback-db"
database_id = "51b6896f-6a4f-4f4e-94f6-c4571a0794a9"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "your-namespace-id"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "feedback-resonite-files"

