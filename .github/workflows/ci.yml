name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: npx @biomejs/biome check

      - name: Check generated Worker types are up to date
        run: npm run types -- --check

      - name: Typecheck
        run: npm run typecheck

      # TODO: add `npm test` here once Vitest is set up (see TODO.md).

      - name: Build
        run: npm run build
